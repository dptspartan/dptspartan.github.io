    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (theme is kept for the browser session).
      (function () {
        var t = null
        try { t = sessionStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = t
        // Language and text direction before first paint, to avoid a layout flip.
        var l = new URLSearchParams(location.search).get('lang')
        try { l = l || sessionStorage.getItem('lang') } catch (e) {}
        l = l || (navigator.language || 'en').slice(0, 2)
        if (['en', 'de', 'tr', 'ar', 'ur'].indexOf(l) < 0) l = 'en'
        document.documentElement.lang = l
        document.documentElement.dir = l === 'ar' || l === 'ur' ? 'rtl' : 'ltr'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Shoaib Rashid, software engineer at Dubizzle Labs. Enable JavaScript to view the full portfolio.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
